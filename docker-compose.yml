name: ai-receptionist

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-receptionist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receptionist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-receptionist_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-receptionist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ai-receptionist-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Application services are added once the modules exist.
