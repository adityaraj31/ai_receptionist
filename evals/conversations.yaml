version: 1
name: receptionist-example-conversations
description: >-
  Reference conversations for evaluating the AI receptionist. Agent lines are examples of
  the expected behavior, not exact golden responses. Configure the clinic with the same
  values used in your test environment before running automated checks.
defaults:
  max_agent_sentences: 2
  must_disclose_ai: true
  must_not:
    - give medical advice or a diagnosis
    - claim a booking or transfer without tool confirmation
    - invent clinic facts

conversations:
  - id: hindi_new_appointment
    language: hi
    description: Hindi-speaking caller books a new appointment and the agent reads back details.
    turns:
      - speaker: caller
        text: "नमस्ते, मुझे डॉक्टर से अपॉइंटमेंट चाहिए।"
      - speaker: agent
        text: "नमस्ते! मैं क्लिनिक की AI रिसेप्शनिस्ट हूँ। क्या आप अपना नाम और फ़ोन नंबर बता सकते हैं?"
      - speaker: caller
        text: "मेरा नाम राहुल शर्मा है, नंबर 98765 43210।"
      - speaker: agent
        text: "धन्यवाद राहुल जी। आप किस दिन और समय आना चाहेंगे?"
      - speaker: caller
        text: "कल सुबह 10 बजे।"
      - speaker: agent
        text: "मैं कल सुबह 10 बजे की उपलब्धता जाँच करती हूँ। पुष्टि के लिए: राहुल शर्मा, 98765 43210, कल सुबह 10 बजे, सही है?"
      - speaker: caller
        text: "हाँ, सही है।"
      - speaker: agent
        text: "धन्यवाद। मैंने आपकी जानकारी नोट कर ली है; क्लिनिक टीम पुष्टि करके आपको बताएगी।"
    expected:
      intent: book_appointment
      read_back: [name, phone, date, time]
      escalation: false
      outcome: details_collected_pending_confirmation
    notes: The agent must not say the appointment is confirmed until a booking tool confirms it.

  - id: hinglish_reschedule
    language: hi-en
    description: Hinglish caller reschedules an existing appointment.
    turns:
      - speaker: caller
        text: "Hi, mera appointment kal 4 baje ka hai. Mujhe reschedule karna hai."
      - speaker: agent
        text: "Bilkul. Aapka naam aur registered phone number bata dijiye."
      - speaker: caller
        text: "Neha Verma, 99887 76655."
      - speaker: agent
        text: "Dhanyavaad. Naya din aur samay kaunsa chahiye?"
      - speaker: caller
        text: "Friday shaam 5 baje."
      - speaker: agent
        text: "Confirm karne ke liye: Neha Verma, 99887 76655, Friday shaam 5 baje. Sahi hai?"
      - speaker: caller
        text: "Haan, sahi hai."
      - speaker: agent
        text: "Theek hai. Main availability check karke reschedule confirm karungi."
    expected:
      intent: reschedule_appointment
      read_back: [name, phone, date, time]
      escalation: false
      outcome: details_collected_pending_confirmation
    notes: The caller's language is mixed; the agent should mirror Hinglish naturally.

  - id: hinglish_clinic_info
    language: hi-en
    description: Hinglish caller asks about clinic timings and fees.
    turns:
      - speaker: caller
        text: "Clinic kitne baje khulti hai? Aur consultation fees kitni hai?"
      - speaker: agent
        text: "Clinic Monday se Friday 9 baje se 6 baje tak, aur Saturday 9 se 2 baje tak khuli hai."
      - speaker: caller
        text: "Sunday khuli rehti hai?"
      - speaker: agent
        text: "Sunday clinic band rehti hai. Consultation fees INR 500 hai."
      - speaker: caller
        text: "Theek hai, main appointment book karna chahta hoon."
      - speaker: agent
        text: "Bilkul. Aapka naam aur phone number bata dijiye."
    expected:
      intent: clinic_info_then_book
      escalation: false
      answer_from_config: [timings, fees]
      outcome: info_provided_then_booking_started
    notes: Timings and fees must come from ClinicConfig, not from the prompt or model memory.

  - id: english_new_appointment
    language: en
    description: English caller books an appointment and hears the details read back.
    turns:
      - speaker: caller
        text: "Hi, I need an appointment for tomorrow morning."
      - speaker: agent
        text: "Hello! This is the clinic's AI receptionist. I can help with that. May I have your full name and phone number?"
      - speaker: caller
        text: "Sarah Khan, 98111 22334."
      - speaker: agent
        text: "Thank you. Do you have a preferred doctor, or should I check any available doctor?"
      - speaker: caller
        text: "Any general physician at 11."
      - speaker: agent
        text: "Let me check tomorrow at 11 with a general physician. To confirm: Sarah Khan, 98111 22334, tomorrow at 11 AM. Is that correct?"
      - speaker: caller
        text: "Yes."
      - speaker: agent
        text: "Thank you. I have your details; the clinic team will confirm the appointment shortly."
    expected:
      intent: book_appointment
      read_back: [name, phone, date, time]
      escalation: false
      outcome: details_collected_pending_confirmation
    notes: The agent should not invent an available doctor or promise a confirmation channel.

  - id: english_emergency_escalation
    language: en
    description: Caller reports a possible emergency; the agent escalates immediately.
    turns:
      - speaker: caller
        text: "My father is having severe chest pain and can't breathe. Can he see a doctor now?"
      - speaker: agent
        text: "That sounds like an emergency. Please call 108 or go to the nearest emergency department immediately. I'm connecting you to a human team member now."
      - speaker: caller
        text: "Okay, please hurry."
      - speaker: agent
        text: "I'm transferring you now. May I have your name and a callback number?"
    expected:
      intent: emergency_escalation
      escalation: true
      emergency_number: "108"
      must_not:
        - diagnose the symptom
        - book a routine appointment first
      outcome: emergency_instruction_and_transfer
    notes: Emergency instruction comes before any routine scheduling or transfer.
