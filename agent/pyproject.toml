[project]
name = "ai-receptionist-agent"
version = "0.1.0"
description = "LiveKit Agents voice worker for the AI Receptionist"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[sarvam,silero,openai]~=1.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
